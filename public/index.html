<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-locked dashboard-collapsed">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Blog home">Blog</a>
      <nav class="nav-actions" aria-label="Primary">
        <button class="avatar-button hidden" id="openProfile" type="button" aria-label="Open profile">
          <img id="headerAvatar" alt="" />
        </button>
        <button class="primary-button" id="openAuth" type="button">Sign in</button>
      </nav>
    </header>

    <aside class="dashboard is-collapsed" id="dashboard" aria-label="Blog dashboard">
      <button class="icon-button dashboard-toggle" id="toggleDashboard" type="button" aria-label="Expand dashboard" aria-expanded="false">
        <span class="dashboard-icon menu-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="sr-only">Toggle dashboard</span>
      </button>
      <div class="dashboard-actions">
        <button class="dashboard-link" id="refreshPosts" type="button">
          <span class="dashboard-text">Refresh</span>
          <span class="dashboard-icon" aria-hidden="true">↻</span>
          <span class="sr-only">Refresh posts</span>
        </button>
        <button class="dashboard-link" id="showPosts" type="button">
          <span class="dashboard-text">Posts</span>
        </button>
        <button class="dashboard-link" id="openCreatePost" type="button">
          <span class="dashboard-text">Create post</span>
        </button>
        <button class="dashboard-link" id="openProfileFromDashboard" type="button">
          <span class="dashboard-text">Profile</span>
        </button>
        <button class="dashboard-link danger-link" id="openLogoutConfirm" type="button">
          <span class="dashboard-text">Logout</span>
        </button>

      </div>
    </aside>

    <button class="theme-toggle" id="toggleTheme" type="button" aria-label="Switch to dark mode">Dark mode</button>

    <main>
      <section class="hero" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">Latest posts</p>
          <h1 id="pageTitle">Read what is new.</h1>
        </div>
        <form class="search-form" id="searchForm">
          <label class="sr-only" for="searchInput">Search posts</label>
          <input id="searchInput" name="search" type="search" placeholder="Search title, content, or category" />
          <button class="primary-button" type="submit">Search</button>
        </form>
      </section>

      <section class="workspace">
        <section class="posts-section" id="postsSection" aria-live="polite">
          <div class="section-heading">
            <h2>Posts</h2>
            <p id="postCount">Loading...</p>
          </div>
          <div id="statusMessage" class="status" role="status"></div>
          <div id="postsGrid" class="posts-grid"></div>
        </section>
      </section>
    </main>

    <dialog id="authDialog" class="auth-dialog">
      <form method="dialog" class="dialog-shell">
        <button class="icon-button close-dialog" id="closeAuth" value="cancel" type="button" aria-label="Close">x</button>
        <div class="panel-heading">
          <p class="eyebrow">Account</p>
          <h2 id="authTitle">Sign in</h2>
        </div>
        <div id="authMessage" class="status"></div>
        <label id="usernameLabel" class="hidden" for="usernameInput">Username</label>
        <input id="usernameInput" class="hidden" type="text" autocomplete="username" />
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" autocomplete="email" required />
        <label for="passwordInput">Password</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required />
        <button class="primary-button wide" id="authSubmit" type="button">Sign in</button>
        <p class="auth-switch" id="authSwitchText">
          Already have an account?
          <button id="authSwitchButton" type="button">signin</button>
        </p>
      </form>
    </dialog>

    <dialog id="logoutDialog" class="auth-dialog">
      <div class="dialog-shell">
        <button class="icon-button close-dialog" id="cancelLogout" value="cancel" type="button" aria-label="Close">x</button>
        <div class="panel-heading">
          <p class="eyebrow">Logout</p>
          <h2>Are you sure?</h2>
        </div>
        <p class="status">You will need to sign in again to continue.</p>
        <div class="dialog-actions">
          <button class="ghost-button" id="stayLoggedIn" type="button">Cancel</button>
          <button class="primary-button danger-button" id="confirmLogout" type="button">Logout</button>
        </div>
      </div>
    </dialog>

    <dialog id="profileSetupDialog" class="profile-dialog">
      <div class="dialog-shell">
        <button class="icon-button close-dialog" id="closeProfileSetup" value="cancel" type="button" aria-label="Close">x</button>
        <div class="panel-heading">
          <p class="eyebrow">Profile</p>
          <h2 id="profileSetupTitle">Complete your profile</h2>
        </div>
        <form id="profileSetupForm" class="stacked-form">
          <div class="form-grid">
            <div>
              <label for="firstNameInput">First name</label>
              <input id="firstNameInput" name="firstName" type="text" maxlength="50" required />
            </div>
            <div>
              <label for="lastNameInput">Last name</label>
              <input id="lastNameInput" name="lastName" type="text" maxlength="50" required />
            </div>
          </div>

          <label for="bioInput">Bio</label>
          <textarea id="bioInput" name="bio" rows="4" maxlength="500" required></textarea>

          <label for="avatarInput">Avatar</label>
          <input id="avatarInput" name="avatar" type="file" accept="image/*" />

          <label for="websiteInput">Personal website</label>
          <input id="websiteInput" name="personalWebsite" type="url" placeholder="https://example.com" />

          <div class="form-grid">
            <div>
              <label for="twitterInput">Twitter</label>
              <input id="twitterInput" name="twitter" type="url" placeholder="https://twitter.com/username" />
            </div>
            <div>
              <label for="facebookInput">Facebook</label>
              <input id="facebookInput" name="facebook" type="url" placeholder="https://facebook.com/username" />
            </div>
          </div>

          <div class="form-grid">
            <div>
              <label for="instagramInput">Instagram</label>
              <input id="instagramInput" name="instagram" type="url" placeholder="https://instagram.com/username" />
            </div>
            <div>
              <label for="linkedinInput">LinkedIn</label>
              <input id="linkedinInput" name="linkedin" type="url" placeholder="https://linkedin.com/in/username" />
            </div>
          </div>

          <input id="countryInput" name="country" type="hidden" />
          <p class="status" id="profileCountryText"></p>
          <div id="profileSetupMessage" class="status"></div>
          <button class="primary-button wide" id="profileSubmitButton" type="submit">Save profile</button>
        </form>
      </div>
    </dialog>

    <dialog id="profileViewDialog" class="profile-dialog">
      <article class="dialog-shell profile-view-shell">
        <button class="icon-button close-dialog" id="closeProfileView" value="cancel" type="button" aria-label="Close">x</button>
        <img id="profileViewAvatar" class="profile-view-avatar" alt="" />
        <div class="profile-view-content">
          <p class="eyebrow" id="profileViewCountry"></p>
          <h2 id="profileViewName"></h2>
          <p id="profileViewBio"></p>
          <div class="profile-links" id="profileViewLinks"></div>
          <button class="primary-button" id="editProfileButton" type="button">Edit profile</button>
        </div>
      </article>
    </dialog>

    <dialog id="createPostDialog" class="post-dialog">
      <div class="dialog-shell">
        <button class="icon-button close-dialog" id="closeCreatePost" value="cancel" type="button" aria-label="Close">x</button>
        <div class="panel-heading">
          <p class="eyebrow">Write</p>
          <h2 id="composeTitle">Create a post</h2>
        </div>
        <form id="postForm" class="stacked-form">
          <label for="postTitle">Title</label>
          <input id="postTitle" name="title" type="text" maxlength="100" required />

          <label for="postCategory">Category</label>
          <select id="postCategory" name="category" required>
            <option value="Technology">Technology</option>
            <option value="Health">Health</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Sports">Sports</option>
          </select>

          <label for="postImage">Image</label>
          <input id="postImage" name="image" type="file" accept="image/*" />

          <label for="postContent">Content</label>
          <textarea id="postContent" name="content" rows="7" maxlength="10000" required></textarea>

          <button class="primary-button wide" type="submit">Publish</button>
        </form>
      </div>
    </dialog>

    <dialog id="editPostDialog" class="post-dialog">
      <div class="dialog-shell">
        <button class="icon-button close-dialog" id="closeEditPost" value="cancel" type="button" aria-label="Close">x</button>
        <div class="panel-heading">
          <p class="eyebrow">Edit</p>
          <h2>Update post</h2>
        </div>
        <form id="editPostForm" class="stacked-form">
          <label for="editPostTitle">Title</label>
          <input id="editPostTitle" name="title" type="text" maxlength="100" required />

          <label for="editPostCategory">Category</label>
          <select id="editPostCategory" name="category" required>
            <option value="Technology">Technology</option>
            <option value="Health">Health</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Sports">Sports</option>
          </select>

          <label for="editPostImage">Image</label>
          <input id="editPostImage" name="image" type="file" accept="image/*" />

          <label for="editPostContent">Content</label>
          <textarea id="editPostContent" name="content" rows="7" maxlength="10000" required></textarea>

          <button class="primary-button wide" type="submit">Save changes</button>
        </form>
      </div>
    </dialog>

    <dialog id="readPostDialog" class="read-post-dialog">
      <article class="dialog-shell read-post-shell">
        <button class="icon-button close-dialog" id="closeReadPost" value="cancel" type="button" aria-label="Close">x</button>
        <img id="readPostImage" class="read-post-image" alt="" />
        <div class="read-post-content">
          <div class="post-meta">
            <span class="post-category" id="readPostCategory"></span>
            <span id="readPostDate"></span>
          </div>
          <h2 id="readPostTitle"></h2>
          <p id="readPostBody"></p>
        </div>
      </article>
    </dialog>

    <script src="./js/app.js"></script>
  </body>
</html>
